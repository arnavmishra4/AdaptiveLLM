global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vllm'
    static_configs:
      - targets: ['vllm:8000']

  - job_name: 'litellm'
    authorization:
      type: Bearer
      credentials: 'sk-12112002'
    static_configs:
      - targets: ['litellm-proxy:4000']

  - job_name: 'gpu'
    static_configs:
      - targets: ['nvidia-exporter:9400']